spring:
  application:
    name: echo-migrant-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:echo_migrant}
    username: ${DB_USER:echo_migrant}
    password: ${DB_PASSWORD:echo_migrant}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8081}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4300}
  jwt:
    secret: ${JWT_SECRET:changeme-super-secret-key-for-echo-migrant-dev-only-please-override-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
    base-url: ${UPLOADS_BASE_URL:http://localhost:8081}
  admin:
    default-email: ${ADMIN_DEFAULT_EMAIL:admin@echomigrant.local}
    default-password: ${ADMIN_DEFAULT_PASSWORD:ChangeMoi123!}

logging:
  level:
    com.echomigrant: INFO
    org.springframework.security: INFO
