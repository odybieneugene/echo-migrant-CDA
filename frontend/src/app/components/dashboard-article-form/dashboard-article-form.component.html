<form [formGroup]="form" (ngSubmit)="submit()" class="border rounded p-3 bg-light">
  <h5 class="mb-3">{{ article ? "Modifier l'article" : 'Nouvel article' }}</h5>

  <div class="mb-3">
    <label class="form-label">Titre</label>
    <input type="text" class="form-control" formControlName="titre">
  </div>

  <div class="mb-3">
    <label class="form-label">Résumé</label>
    <textarea class="form-control" rows="2" formControlName="resume"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Contenu</label>
    <textarea class="form-control" rows="6" formControlName="contenu"></textarea>
  </div>

  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Catégorie</label>
      <select class="form-select" formControlName="categorieId">
        <option [ngValue]="null">—</option>
        @for (c of categories; track c.id) {
          <option [ngValue]="c.id">{{ c.nom }}</option>
        }
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Type</label>
      <select class="form-select" formControlName="typeArticleId">
        <option [ngValue]="null">—</option>
        @for (t of typesArticles; track t.id) {
          <option [ngValue]="t.id">{{ t.nom }}</option>
        }
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Format</label>
      <select class="form-select" formControlName="formatId">
        <option [ngValue]="null">—</option>
        @for (f of formats; track f.id) {
          <option [ngValue]="f.id">{{ f.nom }}</option>
        }
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Statut</label>
      <select class="form-select" formControlName="statutId">
        @for (s of statuts; track s.id) {
          <option [ngValue]="s.id">{{ s.nom }}</option>
        }
      </select>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Tags SEO</label>
    <div class="d-flex flex-wrap gap-2">
      @for (tag of tagsSeo; track tag.id) {
        <button type="button" class="btn btn-sm"
                [class.btn-primary]="isTagSelected(tag.id)"
                [class.btn-outline-secondary]="!isTagSelected(tag.id)"
                (click)="toggleTag(tag.id)">
          #{{ tag.motCle }}
        </button>
      }
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Meta titre</label>
      <input type="text" class="form-control" formControlName="metaTitre">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Meta description</label>
      <input type="text" class="form-control" formControlName="metaDescription">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Meta mots-clés</label>
      <input type="text" class="form-control" formControlName="metaKeywords">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Image de couverture</label>
    <input type="file" class="form-control" accept="image/*" (change)="onImageSelected($event)">
  </div>

  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" id="vedette" formControlName="estEnVedette">
    <label class="form-check-label" for="vedette">Mettre en une (article vedette)</label>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Enregistrer</button>
    <button type="button" class="btn btn-outline-secondary" (click)="cancel.emit()">Annuler</button>
  </div>
</form>
