<section class="hero text-white d-flex align-items-end"
         [style.background-image]="'linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.65)), url(' + (article.imageCouverture || imageParDefaut) + ')'">
  <div class="container py-5">
    <span class="em-etiquette">À la Une</span>
    <h1 class="display-5">{{ article.titre }}</h1>
    @if (article.resume) {
      <p class="lead">{{ article.resume }}</p>
    }
    <a [routerLink]="['/actualites', article.id]" class="btn btn-primary">Lire l'article</a>
  </div>
</section>
