<section id="newsletter" class="py-5 text-white text-center" style="background-color: var(--em-accent);">
  <div class="container">
    <h3>Restez informé</h3>
    <p>Recevez les dernières actualités sur les questions migratoires directement par email.</p>

    @if (!submitted) {
      <form #f="ngForm" class="d-flex justify-content-center gap-2 flex-wrap" (ngSubmit)="subscribe(f)" novalidate>
        <input type="email" class="form-control w-auto" placeholder="Votre email" aria-label="Votre email"
               [(ngModel)]="email" name="email" required email maxlength="255">
        <button type="submit" class="btn btn-light" [disabled]="loading">S'abonner</button>
      </form>
      @if (erreur) {
        <p class="mt-3 mb-0 fw-bold" role="alert">{{ erreur }}</p>
      }
      <p class="small mt-3 mb-0 opacity-75">Votre email sert uniquement à l'envoi de la newsletter. Il n'est jamais partagé.</p>
    } @else {
      <p class="fw-bold">Merci ! Vous êtes inscrit(e) à la newsletter.</p>
    }
  </div>
</section>
