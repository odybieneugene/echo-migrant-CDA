<section class="py-5 text-white text-center" style="background-color: var(--em-accent);">
  <div class="container">
    <h3>Restez informé</h3>
    <p>Recevez les dernières actualités sur les questions migratoires directement par email.</p>

    @if (!submitted) {
      <form class="d-flex justify-content-center gap-2 flex-wrap" (ngSubmit)="subscribe()">
        <input type="email" class="form-control w-auto" placeholder="Votre email" [(ngModel)]="email" name="email" required>
        <button type="submit" class="btn btn-light">S'abonner</button>
      </form>
    } @else {
      <p class="fw-bold">Merci ! Vous êtes inscrit(e) à la newsletter.</p>
    }
  </div>
</section>
