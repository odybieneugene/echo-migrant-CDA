# nginx du conteneur frontend (production).
# En déploiement réel, le HTTPS est assuré devant ce conteneur (Caddy, Traefik ou nginx de l'hôte
# avec Let's Encrypt) : voir DEPLOIEMENT.md.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas afficher la version de nginx dans les en-têtes et les pages d'erreur
    server_tokens off;

    # Taille max d'une requête : images d'articles jusqu'à 5 Mo (limite Spring) + marge du multipart
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité. Piège nginx : un "add_header" dans un bloc location ANNULE tous ceux
    # du niveau server pour ce bloc. Les blocs ci-dessous gèrent donc le cache avec "expires"
    # (qui n'est pas un add_header) : ces en-têtes s'appliquent ainsi à toutes les réponses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API REST -> backend Spring Boot (nom du service dans docker-compose.prod.yml)
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images envoyées par les rédacteurs (servies par le backend depuis son volume)
    location /uploads/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Fichiers JS/CSS générés par Angular : leur nom contient un hash -> cache long sans risque
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
    }

    # index.html jamais en cache : une nouvelle version du site est vue immédiatement
    # ("expires -1" envoie Cache-Control: no-cache)
    location = /index.html {
        expires -1;
    }

    # Application monopage : toute route inconnue (/actualites/3, /dashboard...) renvoie index.html,
    # c'est le routeur Angular qui affiche la bonne page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
